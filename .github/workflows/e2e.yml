name: Atlas browser regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright test runner without expanding production dependencies
        run: pnpm add -Dw @playwright/test@1.55.0 --lockfile=false
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload responsive screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-browser-regression
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
